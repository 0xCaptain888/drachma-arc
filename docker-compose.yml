version: "3.9"

services:
  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
    container_name: drachma-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
    volumes:
      - agent-data:/app/data
    networks:
      - drachma

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: drachma-dashboard
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    networks:
      - drachma

volumes:
  agent-data:

networks:
  drachma:
    driver: bridge
